name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  build:
    name: Build, lint, test, package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package extension
        run: npm run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: twig-toolbox-${{ github.sha }}
          path: '*.vsix'
          if-no-files-found: error
          overwrite: true
